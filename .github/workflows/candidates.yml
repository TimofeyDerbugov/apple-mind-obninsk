# Временная ветка: скачать миниатюры фото-кандидатов, чтобы выбрать подходящие
name: Candidates

on:
  push:
    branches: [photo-candidates]
    paths: ["cand/sources.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp > /dev/null
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -A "AppleMindCatalog/1.0 (github.com/TimofeyDerbugov)" "$url" -o "/tmp/$name.src" || { echo "fail $name"; continue; }
            convert "/tmp/$name.src" -auto-orient -resize '300x300>' -quality 75 "cand/$name" || echo "convert fail $name"
            sleep 0.3
          done < cand/sources.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cand
          git commit -m "Миниатюры кандидатов" || echo nothing
          git push
